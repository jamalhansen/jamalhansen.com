############################
## Site Settings
############################

env: production
description: "Technical blog exploring SQL, Python, and AI development"
keywords: [Python, SQL, DuckDB, LLM, Ollama, Data Science, AI Agents, PostgreSQL, Analytics]
author: Jamal Hansen
images: ["/author.png"]

# Which content sections to show on homepage
mainSections:
  - blog

defaultTheme: auto
disableThemeToggle: false
ShowReadingTime: true
ShowShareButtons: true
ShowPostNavLinks: true
ShowBreadCrumbs: true
ShowCodeCopyButtons: true
ShowWordCount: false
ShowRssButtonInSectionTermList: true
UseHugoToc: true
disableSpecialTitleCharacters: true

# Post cover images
cover:
  hiddenInList: false
  hiddenInSingle: false

############################
## Homepage
############################

homeInfoParams:
  Title: "Hi, I'm Jamal Hansen"
  Content: |
    I write for developers who know one thing well and are learning the next one. SQL to Python. Python to AI. Local tools to production systems.

    <br>

    **Start here:**

    - [SQL for Python Developers](/series/sql-for-python-developers/)
    - [Run AI Locally with Python](/blog/local-ai-stack-uv-ollama/)
    - [Karpathy's LLM Knowledge Base Method](/blog/road-to-agentic-notes/)

    [Get weekly writing on SQL, Python, and AI <span class="btn-subtext">— join the newsletter</span>](https://jamalhansen.beehiiv.com)

socialIcons:
  - name: rss
    url: "index.xml"
  - name: linkedin
    url: "https://linkedin.com/in/jamalhansen"
  - name: github
    url: "https://github.com/jamalhansen"
  - name: X
    url: "https://x.com/jamahans"
  - name: bluesky
    url: "https://bsky.app/profile/jamalhansen.bsky.social"
  - name: mastodon
    url: "https://techhub.social/@jamalhansen"

############################
## Newsletter
############################

beehiivId: "67b6b378-798a-479b-b9fa-dfb258feebaa"

############################
## Analytics
############################

plausible_domain: "jamalhansen.com"

fuseOpts:
      isCaseSensitive: false
      shouldSort: true
      location: 0
      distance: 1000
      threshold: 0.4
      minMatchCharLength: 0
      keys: ["title", "permalink", "summary", "content"]